{% extends "blog/base.html" %}

{% block title %}Login | MyBlog{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card-wrapper">
            <!-- Login Card -->
            <div class="auth-card shadow-lg">
                <!-- Header -->
                <div class="auth-header text-center mb-4">
                    <div class="auth-icon mb-3">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                    <h2 class="auth-title">Admin Login</h2>
                    <p class="auth-subtitle text-muted">Superuser access required</p>
                </div>

                <!-- Error Messages -->
                {% if form.errors %}
                <div class="auth-alert alert alert-danger fade-in" role="alert">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    Invalid credentials. Please try again.
                </div>
                {% endif %}

                <!-- Login Form -->
                <form action="{% url 'login' %}" method="POST" class="auth-form">
                    {% csrf_token %}
                    
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="id_username" name="username" 
                               placeholder="Username" required autofocus>
                        <label for="id_username"><i class="bi bi-person me-2"></i>Username</label>
                    </div>
                    
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="id_password" name="password" 
                               placeholder="Password" required>
                        <label for="id_password"><i class="bi bi-key me-2"></i>Password</label>
                    </div>

                    <button type="submit" class="auth-btn btn btn-primary w-100 py-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                    
                    <input type="hidden" name="next" value="{{ next }}">
                </form>

                <!-- Footer -->
                <div class="auth-footer text-center mt-4">
                    <p class="text-muted small">Need help? Contact <a href="mailto:admin@example.com">site admin</a></p>
                </div>
            </div>
        </div>
    </div>
</section>


{% endblock %}
