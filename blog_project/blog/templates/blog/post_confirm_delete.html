{% extends "blog/base.html" %}

{% block title %}Confirm Deletion | MyBlog{% endblock %}

{% block content %}
<section class="delete-confirmation-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <!-- Delete Confirmation Card -->
                <div class="delete-confirmation-card card border-0 shadow-lg">
                    <div class="card-body p-4 p-md-5 text-center">
                        <!-- Warning Icon -->
                        <div class="delete-icon mb-4">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                        </div>
                        
                        <!-- Confirmation Message -->
                        <h2 class="delete-title mb-3">Confirm Deletion</h2>
                        <p class="delete-message mb-4">
                            You are about to permanently delete the post titled:
                        </p>
                        <div class="post-title-container bg-light p-3 rounded mb-4">
                            <h3 class="post-title mb-0">{{ object }}</h3>
                        </div>
                        <p class="delete-warning text-danger mb-4">
                            <i class="bi bi-exclamation-circle-fill me-2"></i>
                            This action cannot be undone!
                        </p>

                        <!-- Confirmation Buttons -->
                        <form method="POST" class="delete-form">
                            {% csrf_token %}
                            <div class="d-flex flex-column flex-md-row justify-content-center gap-3">
                                <button type="submit" class="btn btn-danger btn-confirm-delete">
                                    <i class="bi bi-trash-fill me-2"></i> Delete Permanently
                                </button>
                                <a href="{% url 'post_detail' pk=post.pk %}" class="btn btn-outline-secondary btn-cancel">
                                    <i class="bi bi-x-circle-fill me-2"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>


{% endblock %}
